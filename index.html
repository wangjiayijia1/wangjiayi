<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0F1924">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="太化看板">
<meta name="description" content="太化新材料化工产品价格看板 - 实时价格、利润分析、行业资讯">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230F1924'/%3E%3Ctext x='32' y='40' font-family='sans-serif' font-size='28' font-weight='bold' fill='%2300A3B4' text-anchor='middle'%3E太化%3C/text%3E%3C/svg%3E">
<title>太化新材料 · 化工价格看板</title>
<style>
:root{
  --c-up:#E03935;--c-down:#16A34A;--c-flat:#8895A5;
  --c-bg:#0F1924;--c-panel:#1A2332;--c-panel2:#243140;--c-border:#2D3D50;
  --c-text:#E8ECF0;--c-text-sec:#8895A5;--c-text-dim:#5A6577;
  --c-accent:#00A3B4;--c-accent2:#0B4D8C;--c-warn:#E8821E;
  --c-profit:#16A34A;--c-loss:#E03935;--radius:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:15px;scroll-behavior:smooth}
body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.5;-webkit-font-smoothing:antialiased}

/* TopBar */
.topbar{background:var(--c-panel);border-bottom:1px solid var(--c-border);position:sticky;top:0;z-index:100}
.topbar-inner{max-width:1400px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:56px}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-logo{font-size:16px;font-weight:700;letter-spacing:.5px}
.topbar-logo span{color:var(--c-accent)}
.topbar-date{font-size:13px;color:var(--c-text-sec)}
.topbar-right{display:flex;align-items:center;gap:16px}
.market-summary{display:flex;gap:16px;font-size:13px}
.ms-item{display:flex;align-items:center;gap:4px}
.ms-num{font-weight:700}
.ms-up{color:var(--c-up)}.ms-down{color:var(--c-down)}.ms-flat{color:var(--c-flat)}
.pwa-badge{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:600;white-space:nowrap}
.pwa-badge.offline{background:rgba(232,130,30,.15);color:var(--c-warn)}
.pwa-badge.installed{background:rgba(0,163,180,.15);color:var(--c-accent);cursor:pointer}

/* Layout */
.container{max-width:1400px;margin:0 auto;padding:20px}
.tab-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tab-btn{padding:8px 20px;border-radius:6px;border:1px solid var(--c-border);background:var(--c-panel);color:var(--c-text-sec);font-size:14px;cursor:pointer;transition:all .2s;font-family:inherit}
.tab-btn:hover{border-color:var(--c-accent);color:var(--c-text)}
.tab-btn.active{background:var(--c-accent2);border-color:var(--c-accent2);color:#fff}
.tab-content{display:none}.tab-content.active{display:block}

/* News Board */
.news-board{background:var(--c-panel);border:1px solid var(--c-border);border-radius:var(--radius);margin-bottom:20px;overflow:hidden}
.news-board-head{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:linear-gradient(135deg,rgba(0,163,180,.08),rgba(11,77,140,.08));border-bottom:1px solid var(--c-border)}
.news-board-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.news-board-title .nb-icon{width:20px;height:20px;border-radius:4px;background:linear-gradient(135deg,var(--c-accent2),var(--c-accent));display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.news-board-count{font-size:12px;color:var(--c-text-dim)}
.news-board-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.news-board-body.expanded{max-height:1200px}
.news-board-toggle{padding:4px 12px;border-radius:4px;border:1px solid var(--c-border);background:var(--c-bg);color:var(--c-text-sec);font-size:12px;cursor:pointer;font-family:inherit;transition:all .2s}
.news-board-toggle:hover{border-color:var(--c-accent);color:var(--c-accent)}
.news-list{padding:8px 0}
.news-item{display:flex;gap:12px;padding:10px 18px;border-bottom:1px solid rgba(45,61,80,.4);transition:background .2s}
.news-item:last-child{border-bottom:none}
.news-item:hover{background:rgba(0,163,180,.04)}
.news-item-date{flex-shrink:0;width:90px;text-align:center}
.news-item-date .ni-day{font-size:18px;font-weight:800;color:var(--c-accent);line-height:1.2}
.news-item-date .ni-month{font-size:11px;color:var(--c-text-dim)}
.news-item-content{flex:1;min-width:0}
.news-item-tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:3px;font-weight:600;margin-bottom:4px}
.news-tag-装置检修{background:rgba(232,130,30,.15);color:var(--c-warn)}
.news-tag-行业快讯{background:rgba(0,163,180,.15);color:var(--c-accent)}
.news-tag-市场动态{background:rgba(123,63,203,.15);color:#A78BFA}
.news-tag-价格预警{background:rgba(224,57,53,.15);color:var(--c-up)}
.news-tag-政策法规{background:rgba(11,77,140,.15);color:#5B9BD5}
.news-item-title{font-size:14px;font-weight:600;color:var(--c-text);margin-bottom:3px;line-height:1.4}
.news-item-summary{font-size:12px;color:var(--c-text-sec);line-height:1.6}
.news-item-source{font-size:11px;color:var(--c-text-dim);margin-top:4px}

/* Section Title */
.sec-title{display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:16px;font-weight:600;color:var(--c-text)}
.sec-title .bar{width:3px;height:18px;background:var(--c-accent);border-radius:2px}
.sec-title .count{font-size:13px;color:var(--c-text-dim);font-weight:400}

/* Period Switcher */
.period-switcher{display:flex;align-items:center;gap:8px;margin-bottom:16px;padding:10px 16px;background:var(--c-panel);border:1px solid var(--c-border);border-radius:var(--radius);flex-wrap:wrap}
.ps-label{font-size:13px;color:var(--c-text-sec);font-weight:600}
.ps-btn{padding:5px 16px;border-radius:5px;border:1px solid var(--c-border);background:var(--c-bg);color:var(--c-text-sec);font-size:13px;cursor:pointer;font-family:inherit;transition:all .2s}
.ps-btn:hover{border-color:var(--c-accent);color:var(--c-text)}
.ps-btn.active{background:var(--c-accent2);border-color:var(--c-accent2);color:#fff}
.ps-hint{font-size:11px;color:var(--c-text-dim);margin-left:auto}

/* Multi-period profit badge */
.profit-period-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:3px;font-weight:600;margin-left:8px;vertical-align:middle}
.ppb-today{background:rgba(0,163,180,.15);color:var(--c-accent)}
.ppb-7d{background:rgba(232,130,30,.15);color:var(--c-warn)}
.ppb-30d{background:rgba(123,63,203,.15);color:#A78BFA}
.profit-trend-mini{display:flex;align-items:center;gap:6px;font-size:11px;margin-top:4px;padding:4px 0;border-top:1px solid rgba(45,61,80,.3)}
.ptm-item{display:flex;align-items:center;gap:3px}
.ptm-arrow{font-size:10px}
.ptm-val{font-weight:600}
.ptm-label{color:var(--c-text-dim)}

/* Price Cards */
.price-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.price-card{background:var(--c-panel);border:1px solid var(--c-border);border-radius:var(--radius);padding:14px 16px;transition:all .2s;cursor:pointer;position:relative;overflow:hidden}
.price-card:hover{border-color:var(--c-accent);background:var(--c-panel2);transform:translateY(-2px)}
.price-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.price-card.up::before{background:var(--c-up)}
.price-card.down::before{background:var(--c-down)}
.price-card.flat::before{background:var(--c-flat)}
.pc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.pc-name{font-size:14px;font-weight:600}
.pc-tag{font-size:10px;padding:1px 6px;border-radius:3px;font-weight:600}
.pc-tag-product{background:rgba(0,163,180,.15);color:var(--c-accent)}
.pc-tag-raw{background:rgba(232,130,30,.15);color:var(--c-warn)}
.pc-tag-mid{background:rgba(123,63,203,.15);color:#A78BFA}
.pc-price{font-size:24px;font-weight:800;line-height:1.2}
.pc-price span{font-size:12px;font-weight:400;color:var(--c-text-dim);margin-left:4px}
.pc-change{display:flex;gap:12px;margin-top:6px;font-size:12px}
.pc-change-item{display:flex;align-items:center;gap:2px}
.pc-change .up{color:var(--c-up)}.pc-change .down{color:var(--c-down)}.pc-change .flat{color:var(--c-flat)}
.pc-formula{font-size:11px;color:var(--c-text-dim);margin-top:6px;font-family:monospace}
.pc-arrow{font-size:16px}
.pc-hint{font-size:10px;color:var(--c-text-dim);margin-top:4px;text-align:right}
.pc-alert-badge{
  display:inline-flex;align-items:center;gap:2px;
  font-size:10px;padding:1px 6px;border-radius:3px;font-weight:600;
  background:rgba(232,130,30,.18);color:var(--c-warn);
  margin-left:6px;cursor:help;
}
.pc-alert-badge.surge{background:rgba(224,57,53,.18);color:var(--c-up)}
.pc-alert-badge.crash{background:rgba(22,163,74,.18);color:var(--c-down)}
.pc-alert-badge.high{background:rgba(232,130,30,.18);color:var(--c-warn)}
.modal-alert{
  background:rgba(232,130,30,.08);border:1px solid rgba(232,130,30,.3);
  border-radius:8px;padding:14px 16px;margin-bottom:16px;
}
.modal-alert.surge{background:rgba(224,57,53,.08);border-color:rgba(224,57,53,.3)}
.modal-alert.crash{background:rgba(22,163,74,.08);border-color:rgba(22,163,74,.3)}
.modal-alert-head{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.modal-alert-icon{font-size:16px}
.modal-alert-title{font-size:13px;font-weight:700;color:var(--c-warn)}
.modal-alert.surge .modal-alert-title{color:var(--c-up)}
.modal-alert.crash .modal-alert-title{color:var(--c-down)}
.modal-alert-body{font-size:13px;color:var(--c-text-sec);line-height:1.7}
.modal-alert-body strong{color:var(--c-text)}
.modal-alert-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.modal-alert-tag{font-size:11px;padding:2px 8px;border-radius:3px;background:var(--c-bg);color:var(--c-text-sec)}

/* Cost Input Bar */
.cost-bar{background:var(--c-panel);border:1px solid var(--c-accent);border-radius:var(--radius);padding:14px 18px;margin-bottom:16px;display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.cost-bar-title{font-size:13px;font-weight:600;color:var(--c-accent);white-space:nowrap}
.cost-input-group{display:flex;align-items:center;gap:6px}
.cost-input-group label{font-size:13px;color:var(--c-text-sec);white-space:nowrap}
.cost-input-group input{width:70px;padding:6px 8px;border-radius:4px;border:1px solid var(--c-border);background:var(--c-bg);color:var(--c-text);font-size:14px;font-family:monospace;text-align:center}
.cost-input-group input:focus{outline:none;border-color:var(--c-accent)}
.cost-input-group .unit{font-size:12px;color:var(--c-text-dim)}
.cost-reset{margin-left:auto;padding:6px 14px;border-radius:4px;border:1px solid var(--c-border);background:var(--c-bg);color:var(--c-text-sec);font-size:12px;cursor:pointer;font-family:inherit}
.cost-reset:hover{border-color:var(--c-warn);color:var(--c-warn)}

/* Utility Override Input */
.utility-input{
  width:90px;padding:3px 8px;border-radius:4px;border:1px solid var(--c-warn);
  background:rgba(232,130,30,.08);color:var(--c-warn);font-size:13px;
  font-family:monospace;font-weight:700;text-align:right;
}
.utility-input:focus{outline:none;border-color:var(--c-accent);box-shadow:0 0 0 2px rgba(0,163,180,.15)}
.utility-input.overridden{border-color:var(--c-accent);color:var(--c-accent);background:rgba(0,163,180,.08)}
.utility-auto{font-size:11px;color:var(--c-text-dim);margin-left:4px}

/* Plant Info */
.plant-info{
  margin-top:10px;padding:10px 12px;border-radius:6px;
  background:rgba(0,163,180,.05);border:1px solid rgba(0,163,180,.15);
}
.plant-capacity{
  display:inline-block;padding:2px 8px;border-radius:3px;
  background:rgba(0,163,180,.15);color:var(--c-accent);
  font-size:12px;font-weight:700;margin-bottom:6px;
}
.plant-unit{font-size:12px;color:var(--c-text-main);font-weight:600;margin-bottom:4px}
.plant-row{display:flex;gap:6px;margin-bottom:3px;font-size:11px;line-height:1.5}
.plant-row .pl-label{color:var(--c-accent);flex-shrink:0;font-weight:600}
.plant-row .pl-text{color:var(--c-text-dim)}

/* Profit Card: clickable hint */
.profit-card{cursor:pointer}
.profit-card:hover{border-color:var(--c-accent)}
.profit-ai-hint{
  margin-top:8px;padding:6px 10px;border-radius:4px;
  background:rgba(0,163,180,.08);border:1px solid rgba(0,163,180,.2);
  font-size:11px;color:var(--c-accent);text-align:center;
  display:flex;align-items:center;justify-content:center;gap:4px;
  transition:background .2s;
}
.profit-card:hover .profit-ai-hint{background:rgba(0,163,180,.15)}

/* Analysis content inside modalBox */
.analysis-headline{
  font-size:16px;font-weight:700;color:var(--c-accent);
  margin-bottom:6px;padding-right:24px;line-height:1.5;
}
.analysis-sub{
  font-size:12px;color:var(--c-text-dim);margin-bottom:16px;
}
.analysis-section-title{
  font-size:13px;font-weight:700;color:var(--c-text-main);
  margin:16px 0 8px;display:flex;align-items:center;gap:6px;
}
.analysis-section-title .ast-dot{
  width:6px;height:6px;border-radius:50%;background:var(--c-warn);
}
.analysis-reason-list{
  list-style:none;padding:0;margin:0;
}
.analysis-reason-list li{
  position:relative;padding:6px 0 6px 18px;
  font-size:13px;line-height:1.6;color:var(--c-text-sec);
  border-bottom:1px solid rgba(45,61,80,.4);
}
.analysis-reason-list li:last-child{border-bottom:none}
.analysis-reason-list li::before{
  content:"";position:absolute;left:4px;top:13px;
  width:5px;height:5px;border-radius:50%;background:var(--c-accent);
}
.analysis-outlook{
  margin-top:12px;padding:10px 12px;border-radius:6px;
  background:rgba(232,130,30,.08);border-left:3px solid var(--c-warn);
  font-size:13px;line-height:1.6;color:var(--c-text-main);
}
.analysis-tags{
  display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;
}
.analysis-tag{
  padding:3px 10px;border-radius:12px;font-size:11px;
  background:rgba(0,163,180,.1);color:var(--c-accent);
  border:1px solid rgba(0,163,180,.2);
}
.analysis-metrics{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;
}
.analysis-metric{
  text-align:center;padding:10px 6px;border-radius:6px;
  background:rgba(45,61,80,.3);
}
.analysis-metric .am-val{font-size:18px;font-weight:700;font-family:monospace}
.analysis-metric .am-lbl{font-size:11px;color:var(--c-text-dim);margin-top:2px}

/* Peer Plants Section */
.peer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-top:14px}
.peer-card{
  background:var(--c-panel);border:1px solid var(--c-border);border-radius:var(--radius);
  padding:16px;position:relative;transition:all .2s;
}
.peer-card:hover{border-color:var(--c-accent);box-shadow:0 2px 12px rgba(0,0,0,.2)}
.peer-card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.peer-name{font-size:14px;font-weight:700;color:var(--c-text-main)}
.peer-location{
  font-size:11px;padding:2px 8px;border-radius:3px;
  background:rgba(0,163,180,.1);color:var(--c-accent);white-space:nowrap;
}
.peer-products{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.peer-product-tag{
  font-size:11px;padding:2px 7px;border-radius:3px;
  background:rgba(45,61,80,.5);color:var(--c-text-sec);
}
.peer-capacity{
  font-size:13px;font-weight:600;color:var(--c-warn);margin-bottom:6px;
}
.peer-status{
  font-size:12px;line-height:1.6;color:var(--c-text-sec);
  padding:8px 10px;border-radius:4px;background:rgba(45,61,80,.3);
  margin-bottom:6px;
}
.peer-note{
  font-size:11px;line-height:1.5;color:var(--c-text-dim);
  padding-left:10px;border-left:2px solid var(--c-accent);
}

/* Profit Cards */
.profit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.profit-card{background:var(--c-panel);border:1px solid var(--c-border);border-radius:var(--radius);padding:18px;position:relative;overflow:hidden;transition:all .2s}
.profit-card.profit{border-color:rgba(22,163,74,.3)}
.profit-card.loss{border-color:rgba(224,57,53,.3)}
.profit-card:hover{transform:translateY(-2px)}
.pc-status{position:absolute;top:0;right:0;padding:4px 12px;font-size:11px;font-weight:700;border-radius:0 0 0 8px}
.profit .pc-status{background:rgba(22,163,74,.2);color:var(--c-profit)}
.loss .pc-status{background:rgba(224,57,53,.2);color:var(--c-loss)}
.profit-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.profit-name{font-size:15px;font-weight:600}
.profit-calc{background:var(--c-bg);border-radius:6px;padding:12px;margin-bottom:12px;font-size:13px;line-height:1.8}
.profit-calc .row{display:flex;justify-content:space-between;align-items:center}
.profit-calc .label{color:var(--c-text-sec)}
.profit-calc .value{font-weight:600}
.profit-calc .value.editable{color:var(--c-accent)}
.profit-calc .sep{height:1px;background:var(--c-border);margin:8px 0}
.profit-result{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:6px}
.profit .profit-result{background:rgba(22,163,74,.08)}
.loss .profit-result{background:rgba(224,57,53,.08)}
.profit-result .pr-label{font-size:13px;color:var(--c-text-sec)}
.profit-result .pr-value{font-size:22px;font-weight:800}
.profit .pr-value{color:var(--c-profit)}
.loss .pr-value{color:var(--c-loss)}
.profit-bar{height:6px;border-radius:3px;background:var(--c-bg);margin-top:12px;overflow:hidden;position:relative}
.profit-bar-fill{height:100%;border-radius:3px;transition:width .4s}
.profit .profit-bar-fill{background:var(--c-profit)}
.loss .profit-bar-fill{background:var(--c-loss)}
.profit-threshold{font-size:11px;color:var(--c-text-dim);margin-top:4px}

/* AI Analysis */
.ai-panel{background:linear-gradient(135deg,var(--c-panel) 0%,var(--c-panel2) 100%);border:1px solid var(--c-border);border-radius:var(--radius);padding:20px;margin-top:20px}
.ai-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.ai-icon{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--c-accent2),var(--c-accent));display:flex;align-items:center;justify-content:center;font-size:18px}
.ai-title{font-size:16px;font-weight:700}
.ai-subtitle{font-size:12px;color:var(--c-text-sec)}
.ai-content{display:grid;gap:16px}
.ai-section{background:var(--c-bg);border-radius:6px;padding:16px}
.ai-section h4{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.ai-section h4 .dot{width:6px;height:6px;border-radius:50%}
.ai-section.loss h4 .dot{background:var(--c-loss)}
.ai-section.profit h4 .dot{background:var(--c-profit)}
.ai-section.alert h4 .dot{background:var(--c-warn)}
.ai-section.advice h4 .dot{background:var(--c-accent)}
.ai-section p{font-size:13px;color:var(--c-text-sec);line-height:1.7;margin-bottom:8px}
.ai-section p:last-child{margin-bottom:0}
.ai-section strong{color:var(--c-text);font-weight:600}
.ai-section .warn-text{color:var(--c-warn);font-weight:600}

<script>
// ==================== DATA LOADING ====================
// Prices loaded from data.json (auto-updated by GitHub Actions daily)
let products = [];
let rawMaterials = [];
let intermediates = [];
let profitLines = [];
let peerPlants = [];
let newsItems = [];
let defaultCosts = {h2:1.50, steam:220, power:0.55};
let costParams = {
  h2: parseFloat(localStorage.getItem('th_cost_h2')) || defaultCosts.h2,
  steam: parseFloat(localStorage.getItem('th_cost_steam')) || defaultCosts.steam,
  power: parseFloat(localStorage.getItem('th_cost_power')) || defaultCosts.power,
};
let priceData = null;
let priceHistory = [];
let activeProfitPeriod = 'today'; // 'today' | '7d' | '30d'

async function loadData(cacheBust=false){
  try{
    const url = cacheBust ? ('data.json?t='+Date.now()) : 'data.json';
    const resp = await fetch(url);
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    priceData = await resp.json();
    products = priceData.products || [];
    rawMaterials = priceData.rawMaterials || [];
    intermediates = priceData.intermediates || [];
    profitLines = priceData.profitLines || [];
    peerPlants = priceData.peerPlants || [];
    newsItems = priceData.news || [];
    if(priceData.defaultCosts){
      defaultCosts = priceData.defaultCosts;
      costParams = {
        h2: parseFloat(localStorage.getItem('th_cost_h2')) || defaultCosts.h2,
        steam: parseFloat(localStorage.getItem('th_cost_steam')) || defaultCosts.steam,
        power: parseFloat(localStorage.getItem('th_cost_power')) || defaultCosts.power,
      };
    }
    const dsEl = document.querySelector('.data-source');
    if(dsEl && priceData.lastUpdate){
      dsEl.innerHTML = '\u6570\u636e\u6765\u6e90\uff1a\u751f\u610f\u793e(100ppi.com)<br>\u4ef7\u683c\u66f4\u65b0\u65f6\u95f4\uff1a' + priceData.lastUpdate + ' \u00b7 \u4ec5\u4f9b\u53c2\u8003\uff0c\u4e0d\u6784\u6210\u4ea4\u6613\u4f9d\u636e';
    }
    // Load price history in background (non-blocking)
    loadHistory(cacheBust);
    return true;
  }catch(err){
    console.error('Failed to load data.json:', err);
    const dateEl = document.getElementById('topDate');
    if(dateEl) dateEl.textContent = '\u26a0 \u6570\u636e\u52a0\u8f7d\u5931\u8d25\uff0c\u8bf7\u7a0d\u540e\u5237\u65b0';
    return false;
  }
}

// ==================== PROFIT LINES ====================
// Loaded from data.json via loadData()

// ==================== LOAD PRICE HISTORY ====================
async function loadHistory(cacheBust=false){
  try{
    const url = cacheBust ? ('price_history.json?t='+Date.now()) : 'price_history.json';
    const resp = await fetch(url);
    if(!resp.ok){ console.warn('price_history.json not found, using mock data'); return; }
    const histData = await resp.json();
    priceHistory = histData.history || [];
  }catch(err){
    console.warn('Failed to load price_history.json:', err);
  }
}

// Get real history for a product, fallback to mock
function getHistory(item){
  if(priceHistory.length >= 7){
    const hist = priceHistory.slice(-30).map(h => ({
      date: h.date.slice(5).replace('-', '/'),
      price: h.prices[item.name] || item.price
    }));
    // Ensure last point matches current
    if(hist.length > 0) hist[hist.length-1].price = item.price;
    return hist;
  }
  return generateHistory(item);
}

// Calculate average profit for a given period
function getAvgProfit(line, days){
  if(priceHistory.length < days) days = priceHistory.length;
  if(days < 1) return null;
  const recent = priceHistory.slice(-days);
  let total = 0;
  let count = 0;
  recent.forEach(h => {
    const snap = (h.profitLines || []).find(p => p.name === line.name);
    if(snap){
      let rawCost = 0;
      snap.rawMaterials.forEach(rm => { rawCost += (line.rawMaterials.find(r => r.label === rm.label) || {}).qty * rm.price || 0; });
      const h2Cost = line.h2Qty * costParams.h2;
      const steamCost = line.steamQty * costParams.steam;
      const powerCost = line.powerQty * costParams.power;
      const utilityTotal = utilityOverrides.hasOwnProperty(line.name) ? utilityOverrides[line.name] : (h2Cost + steamCost + powerCost);
      const otherCost = otherCostOverrides.hasOwnProperty(line.name) ? otherCostOverrides[line.name] : line.otherCost;
      const byproduct = line.byproduct || 0;
      const profit = snap.productPrice - rawCost - utilityTotal - otherCost + byproduct;
      total += profit;
      count++;
    }
  });
  return count > 0 ? total / count : null;
}

// ==================== PEER PLANTS ====================
// peerPlants loaded from data.json (declared above)
function renderPeerPlants(){
  const html=peerPlants.map(p=>{
    const tags=p.products.map(t=>'<span class="peer-product-tag">'+t+'</span>').join("");
    return '<div class="peer-card">'+
      '<div class="peer-card-head">'+
        '<div class="peer-name">'+p.name+'</div>'+
        '<div class="peer-location">'+p.location+'</div>'+
      '</div>'+
      '<div class="peer-products">'+tags+'</div>'+
      '<div class="peer-capacity">'+p.capacity+'</div>'+
      '<div class="peer-status">'+p.status+'</div>'+
      '<div class="peer-note">'+p.note+'</div>'+
    '</div>';
  }).join("");
  document.getElementById("peerGrid").innerHTML=html;
}

// ==================== NEWS BOARD ====================
function renderNewsBoard(){
  const board=document.getElementById("newsBoard");
  if(!board) return;
  if(!newsItems || newsItems.length===0){
    board.style.display="none";
    return;
  }
  board.style.display="block";
  document.getElementById("newsCount").textContent="("+newsItems.length+")";
  const html=newsItems.map(n=>{
    const parts=(n.date||"").split("-");
    const monthStr=parts.length>=2?(parts[1]+"\u6708"):"";
    const dayStr=parts.length>=3?parts[2]:"";
    const tagClass="news-tag-"+(n.category||"\u5176\u4ed6");
    return '<div class="news-item">'+
      '<div class="news-item-date"><div class="ni-day">'+dayStr+'</div><div class="ni-month">'+monthStr+'</div></div>'+
      '<div class="news-item-content">'+
        '<span class="news-item-tag '+tagClass+'">'+(n.category||"")+'</span>'+
        '<div class="news-item-title">'+n.title+'</div>'+
        '<div class="news-item-summary">'+n.summary+'</div>'+
        (n.source?'<div class="news-item-source">\u6765\u6e90\uff1a'+n.source+'</div>':'')+
      '</div>'+
    '</div>';
  }).join("");
  document.getElementById("newsList").innerHTML=html;
}

function initNewsToggle(){
  const toggle=document.getElementById("newsToggle");
  const body=document.getElementById("newsBody");
  if(!toggle||!body) return;
  body.classList.add("expanded");
  toggle.innerHTML="\u6536\u8d77 \u25B2";
  toggle.addEventListener("click",()=>{
    if(body.classList.contains("expanded")){
      body.classList.remove("expanded");
      toggle.innerHTML="\u5c55\u5f00 \u25BC";
    }else{
      body.classList.add("expanded");
      toggle.innerHTML="\u6536\u8d77 \u25B2";
    }
  });
}

// ==================== CALCULATE PROFIT ====================
// utilityOverrides / otherCostOverrides: 每条产品线可手动覆盖公用工程综合成本 / 其他辅料成本
// key = productLine name, value = number (用户输入的覆盖值)
const utilityOverrides = {};
const otherCostOverrides = {};

function calcProfit(line){
  let rawCost=0;
  line.rawMaterials.forEach(rm=>{rawCost+=rm.qty*rm.price});
  const h2Cost=line.h2Qty*costParams.h2;
  const steamCost=line.steamQty*costParams.steam;
  const powerCost=line.powerQty*costParams.power;
  const hasOtherOverride=otherCostOverrides.hasOwnProperty(line.name);
  const otherCost=hasOtherOverride?otherCostOverrides[line.name]:line.otherCost;
  const byproduct=line.byproduct||0;
  const autoUtility=h2Cost+steamCost+powerCost;
  const hasOverride=utilityOverrides.hasOwnProperty(line.name);
  const utilityTotal=hasOverride?utilityOverrides[line.name]:autoUtility;
  const totalCost=rawCost+utilityTotal+otherCost-byproduct;
  const profit=line.productPrice-totalCost;
  return{profit,rawCost,h2Cost,steamCost,powerCost,utilityTotal,autoUtility,hasOverride,otherCost,hasOtherOverride,byproduct,totalCost};
}

function fmtMoney(n){
  const r=Math.round(n);
  return (r>0?"+":"")+r.toLocaleString();
}
function fmtCost(n){
  return "-"+Math.round(n).toLocaleString();
}

// ==================== GENERATE 30-DAY HISTORY ====================
function generateHistory(item){
  const history=[];
  const today=new Date();
  const cur=item.price;
  const totalChange=(item.weekPct/100)*(30/7);
  const startPrice=cur/(1+totalChange);
  for(let i=29;i>=0;i--){
    const d=new Date(today);
    d.setDate(d.getDate()-i);
    const progress=(29-i)/29;
    const base=startPrice+(cur-startPrice)*progress;
    const noise=(Math.sin(i*1.3+item.name.length*2)*0.4+Math.sin(i*2.7+item.name.length)*0.3+Math.sin(i*0.9)*0.3)*Math.max(cur*0.008,1);
    const price=Math.max(0,base+noise);
    history.push({date:(d.getMonth()+1)+"/"+d.getDate(),price:Math.round(price*100)/100});
  }
  history[history.length-1].price=cur;
  return history;
}

// ==================== RENDER PRICE CARDS ====================
function renderPriceCard(item){
  const arrow=item.trend==="up"?"\u25B2":item.trend==="down"?"\u25BC":"\u2014";
  const changeColor=item.trend==="up"?"up":item.trend==="down"?"down":"flat";
  const weekColor=item.weekPct>0?"up":item.weekPct<0?"down":"flat";
  const weekArrow=item.weekPct>0?"\u25B2":item.weekPct<0?"\u25BC":"\u2014";
  const tagClass=item.tag==="product"?"pc-tag-product":item.tag==="raw"?"pc-tag-raw":"pc-tag-mid";
  const tagLabel=item.tag==="product"?"\u4ea7\u54c1":item.tag==="raw"?"\u539f\u6599":"\u4e2d\u95f4\u4f53";
  const changeStr=item.change>0?("+"+item.change):item.change<0?item.change:"0";
  const dataKey=item.name;
  let alertBadge="";
  if(item.alert){
    const aType=item.alert.type;
    let badgeIcon="\u26a0",badgeText="";
    if(aType==="surge"){badgeIcon="\u25B2";badgeText="\u5f02\u5e38\u6da8"}
    else if(aType==="crash"){badgeIcon="\u25BC";badgeText="\u5f02\u5e38\u8dcc"}
    else if(aType==="high"){badgeIcon="\u26a0";badgeText="\u4ef7\u683c\u5f02\u5e38"}
    alertBadge='<span class="pc-alert-badge '+aType+'">'+badgeIcon+' '+badgeText+'</span>';
  }
  return '<div class="price-card '+item.trend+'" data-key="'+dataKey+'">'+
    '<div class="pc-head"><div class="pc-name">'+item.name+alertBadge+'</div><div class="pc-tag '+tagClass+'">'+tagLabel+'</div></div>'+
    '<div class="pc-price">'+item.price.toLocaleString()+'<span>'+item.unit+'</span></div>'+
    '<div class="pc-change">'+
      '<div class="pc-change-item '+changeColor+'"><span class="pc-arrow">'+arrow+'</span>'+changeStr+' ('+(item.changePct>0?"+":"")+item.changePct+'%)</div>'+
      '<div class="pc-change-item '+weekColor+'">\u5468'+weekArrow+' '+(item.weekPct>0?"+":"")+item.weekPct+'%</div>'+
    '</div>'+
    '<div class="pc-formula">'+item.formula+'</div>'+
    '<div class="pc-hint">'+(item.alert?'\u70b9\u51fb\u67e5\u770b\u8d8b\u52bf\u53ca\u5f02\u5e38\u539f\u56e0':'\u70b9\u51fb\u67e5\u770b\u8d8b\u52bf')+' \u203a</div>'+
  '</div>';
}

// ==================== RENDER PROFIT CARDS ====================
function renderProfitCards(){
  const periodLabels = {today: '\u5f53\u65e5', '7d': '7\u65e5\u5747\u503c', '30d': '30\u65e5\u5747\u503c'};
  const periodBadgeClass = {today:'ppb-today','7d':'ppb-7d','30d':'ppb-30d'};
  const html=profitLines.map(line=>{
    const r=calcProfit(line);
    const displayProfit = activeProfitPeriod === 'today' ? r.profit : (getAvgProfit(line, activeProfitPeriod === '7d' ? 7 : 30) || r.profit);
    const status=displayProfit>=line.threshold?"profit":"loss";
    const maxBar=5000;
    const barWidth=Math.min(Math.abs(displayProfit)/maxBar*100,100);
    const statusText=status==="profit"?"\u76c8\u5229":"\u4e8f\u635f";
    // Multi-period comparison
    const avg7 = getAvgProfit(line, 7);
    const avg30 = getAvgProfit(line, 30);
    let trendHTML = '';
    if(avg7 !== null || avg30 !== null){
      trendHTML = '<div class="profit-trend-mini">';
      if(activeProfitPeriod !== 'today'){
        const todayDiff = r.profit - (activeProfitPeriod === '7d' ? avg7 : avg30);
        const trendIcon = todayDiff > 0 ? '\u25B2' : todayDiff < 0 ? '\u25BC' : '\u2014';
        const trendColor = todayDiff > 0 ? 'var(--c-up)' : todayDiff < 0 ? 'var(--c-down)' : 'var(--c-flat)';
        trendHTML += '<div class="ptm-item"><span class="ptm-label">\u5f53\u65e5vs'+periodLabels[activeProfitPeriod]+':</span><span class="ptm-arrow" style="color:'+trendColor+'">'+trendIcon+'</span><span class="ptm-val" style="color:'+trendColor+'">'+(todayDiff>0?'+':'')+Math.round(todayDiff).toLocaleString()+'</span></div>';
      }
      if(avg7 !== null && activeProfitPeriod !== '7d'){
        trendHTML += '<div class="ptm-item"><span class="ptm-label">7\u65e5\u5747:</span><span class="ptm-val" style="color:var(--c-warn)">'+Math.round(avg7).toLocaleString()+'</span></div>';
      }
      if(avg30 !== null && activeProfitPeriod !== '30d'){
        trendHTML += '<div class="ptm-item"><span class="ptm-label">30\u65e5\u5747:</span><span class="ptm-val" style="color:#A78BFA">'+Math.round(avg30).toLocaleString()+'</span></div>';
      }
      trendHTML += '</div>';
    }
    let calcRows='';
    calcRows+='<div class="row"><span class="label">\u4ea7\u54c1\u552e\u4ef7</span><span class="value">+'+line.productPrice.toLocaleString()+' \u5143/\u5428</span></div>';
    line.rawMaterials.forEach(rm=>{
      calcRows+='<div class="row"><span class="label">'+rm.label+' '+rm.qty+rm.unit+' x '+rm.price.toLocaleString()+'</span><span class="value">'+fmtCost(rm.qty*rm.price)+' \u5143</span></div>';
    });
    if(line.h2Qty>0) calcRows+='<div class="row"><span class="label">\u6c22\u6c14 '+line.h2Qty+' Nm3 x '+costParams.h2.toFixed(2)+'</span><span class="value editable">'+fmtCost(r.h2Cost)+' \u5143</span></div>';
    if(line.steamQty>0) calcRows+='<div class="row"><span class="label">\u84b8\u6c7d '+line.steamQty+' \u5428 x '+costParams.steam+'</span><span class="value editable">'+fmtCost(r.steamCost)+' \u5143</span></div>';
    else if(line.steamQty<0) calcRows+='<div class="row"><span class="label">\u526f\u4ea7\u84b8\u6c7d '+(-line.steamQty)+' \u5428 x '+costParams.steam+'</span><span class="value" style="color:var(--c-profit)">+'+Math.round(-r.steamCost).toLocaleString()+' \u5143</span></div>';
    if(line.powerQty>0) calcRows+='<div class="row"><span class="label">\u7535\u529b '+line.powerQty+' kWh x '+costParams.power.toFixed(2)+'</span><span class="value editable">'+fmtCost(r.powerCost)+' \u5143</span></div>';
    // 公用工程综合成本（可手动覆盖）
    const utilClass=r.hasOverride?'utility-input overridden':'utility-input';
    const utilVal=r.hasOverride?Math.round(r.utilityTotal):Math.round(r.autoUtility);
    calcRows+='<div class="row" style="border-top:1px solid rgba(45,61,80,.5);padding-top:4px;margin-top:2px"><span class="label" style="color:var(--c-accent);font-weight:600">\u2192 \u516c\u7528\u5de5\u7a0b\u7efc\u5408\u6210\u672c</span><span class="value"><input type="number" class="'+utilClass+'" data-line="'+line.name+'" value="'+utilVal+'" step="1" min="0" style="width:90px"> \u5143</span></div>';
    if(line.otherCost>0) {
      const oClass=r.hasOtherOverride?'utility-input overridden':'utility-input';
      const oVal=r.hasOtherOverride?Math.round(r.otherCost):Math.round(line.otherCost);
      calcRows+='<div class="row"><span class="label">\u5176\u4ed6\u8f85\u6599(\u50ac\u5316\u5242/\u6eb6\u5242\u7b49)</span><span class="value"><input type="number" class="'+oClass+'" data-line="'+line.name+'" data-type="other" value="'+oVal+'" step="1" min="0" style="width:90px"> \u5143</span></div>';
    }
    if(r.byproduct>0) calcRows+='<div class="row"><span class="label">'+(line.byproductLabel||"\u526f\u4ea7\u56de\u6536")+'</span><span class="value" style="color:var(--c-profit)">+'+r.byproduct.toLocaleString()+' \u5143</span></div>';
    calcRows+='<div class="sep"></div>';
    calcRows+='<div class="row"><span class="label">\u5428\u6bdb\u5229</span><span class="value" style="color:'+(status==='profit'?'var(--c-profit)':'var(--c-loss)')+';font-weight:800">'+fmtMoney(r.profit)+' \u5143/\u5428</span></div>';
    // 装置信息
    if(line.plant){
      calcRows+='<div class="plant-info">';
      calcRows+='<div class="plant-capacity">'+line.plant.capacity+'</div>';
      calcRows+='<div class="plant-unit">'+line.plant.unitName+'</div>';
      calcRows+='<div class="plant-row"><span class="pl-label">\u8fd0\u884c</span><span class="pl-text">'+line.plant.status+'</span></div>';
      calcRows+='<div class="plant-row"><span class="pl-label">\u4f18\u52bf</span><span class="pl-text">'+line.plant.advantage+'</span></div>';
      calcRows+='</div>';
    }
    return '<div class="profit-card '+status+'">'+
      '<div class="pc-status">'+statusText+'<span class="profit-period-badge '+periodBadgeClass[activeProfitPeriod]+'">'+periodLabels[activeProfitPeriod]+'</span></div>'+
      '<div class="profit-head"><div class="profit-name">'+line.name+'</div></div>'+
      '<div class="profit-calc">'+calcRows+'</div>'+
      '<div class="profit-result"><span class="pr-label">\u5229\u6da6\u72b6\u6001</span><span class="pr-value">'+fmtMoney(displayProfit)+'</span></div>'+
      '<div class="profit-bar"><div class="profit-bar-fill" style="width:'+barWidth+'%"></div></div>'+
      '<div class="profit-threshold">\u9884\u8b66\u9608\u503c: '+line.threshold+' \u5143/\u5428 \u00b7 \u5f53\u524d'+(displayProfit<line.threshold?"\u5df2\u4f4e\u4e8e":"\u9ad8\u4e8e")+"\u9608\u503c"+(displayProfit<line.threshold?" \u26a0":"")+'</div>'+
      trendHTML+
      (line.analysis?'<div class="profit-ai-hint">\u25b8 \u70b9\u51fb\u67e5\u770b AI \u5e02\u573a\u5206\u6790</div>':'')+
    '</div>';
  }).join("");
  document.getElementById("profitGrid").innerHTML=html;
  // Bind override inputs (公用工程 + 其他辅料) — debounce 避免输入时重建 DOM 丢焦点
  let overrideTimer=null;
  document.querySelectorAll(".utility-input").forEach(input=>{
    input.addEventListener("input",()=>{
      const lineName=input.dataset.line;
      const type=input.dataset.type||"utility";
      const val=parseFloat(input.value);
      const overrides=type==="other"?otherCostOverrides:utilityOverrides;
      if(!isNaN(val)&&val>=0){
        overrides[lineName]=val;
        input.classList.add("overridden");
      }else{
        delete overrides[lineName];
        input.classList.remove("overridden");
      }
      // 更新当前卡片的利润显示（不重建 DOM）
      updateSingleProfitCard(lineName, input);
      // debounce 刷新图表和AI分析
      clearTimeout(overrideTimer);
      overrideTimer=setTimeout(()=>{
        renderSpreadBars();
        renderAIAnalysis();
      },400);
    });
    input.addEventListener("focus",()=>{
      input.select();
    });
  });
  // Bind profit card click for AI analysis
  initProfitCardClick();
}

// 更新单张利润卡片的利润数值（不重建 DOM，避免输入框失焦）
function updateSingleProfitCard(lineName, sourceInput){
  const line=profitLines.find(l=>l.name===lineName);
  if(!line) return;
  const r=calcProfit(line);
  const displayProfit = activeProfitPeriod === 'today' ? r.profit : (getAvgProfit(line, activeProfitPeriod === '7d' ? 7 : 30) || r.profit);
  const card=sourceInput.closest(".profit-card");
  if(!card) return;
  // 更新利润状态
  const status=displayProfit>=line.threshold?"profit":"loss";
  const statusText=status==="profit"?"\u76c8\u5229":"\u4e8f\u635f";
  card.className="profit-card "+status;
  const pcStatus=card.querySelector(".pc-status");
  if(pcStatus){
    const periodLabels = {today: '\u5f53\u65e5', '7d': '7\u65e5\u5747\u503c', '30d': '30\u65e5\u5747\u503c'};
    const periodBadgeClass = {today:'ppb-today','7d':'ppb-7d','30d':'ppb-30d'};
    pcStatus.innerHTML = statusText + '<span class="profit-period-badge '+periodBadgeClass[activeProfitPeriod]+'">'+periodLabels[activeProfitPeriod]+'</span>';
  }
  // 更新吨毛利
  const rows=card.querySelectorAll(".profit-calc .row");
  const lastRow=rows[rows.length-1];
  if(lastRow){
    const valSpan=lastRow.querySelector(".value");
    if(valSpan){
      valSpan.textContent=fmtMoney(displayProfit)+" \u5143/\u5428";
      valSpan.style.color=status==="profit"?"var(--c-profit)":"var(--c-loss)";
    }
  }
  // 更新利润结果
  const prValue=card.querySelector(".pr-value");
  if(prValue) prValue.textContent=fmtMoney(displayProfit);
  // 更新进度条
  const barFill=card.querySelector(".profit-bar-fill");
  if(barFill){
    const maxBar=5000;
    barFill.style.width=Math.min(Math.abs(displayProfit)/maxBar*100,100)+"%";
  }
  // 更新预警阈值文字
  const thresholdDiv=card.querySelector(".profit-threshold");
  if(thresholdDiv){
    thresholdDiv.textContent="\u9884\u8b66\u9608\u503c: "+line.threshold+" \u5143/\u5428 \u00b7 \u5f53\u524d"+(displayProfit<line.threshold?"\u5df2\u4f4e\u4e8e":"\u9ad8\u4e8e")+"\u9608\u503c"+(displayProfit<line.threshold?" \u26a0":"");
  }
}

// ==================== RENDER SPREAD BARS ====================
function renderSpreadBars(){
  const maxSpread=4500;
  const html=profitLines.map(line=>{
    const r=calcProfit(line);
    const displayProfit = activeProfitPeriod === 'today' ? r.profit : (getAvgProfit(line, activeProfitPeriod === '7d' ? 7 : 30) || r.profit);
    const isProfit=displayProfit>=line.threshold;
    const width=Math.min(Math.abs(displayProfit)/maxSpread*100,100);
    const side=displayProfit>=0?"left:50%":"right:50%";
    return '<div class="spread-bar-row">'+
      '<div class="spread-bar-label">'+line.spreadLabel+'</div>'+
      '<div class="spread-bar-track"><div class="spread-bar-zero"></div>'+
        '<div class="spread-bar-fill '+(isProfit?'profit':'loss')+'" style="'+side+';width:'+width+'%">'+fmtMoney(displayProfit)+'</div>'+
      '</div>'+
      '<div class="spread-bar-value" style="color:'+(isProfit?'var(--c-profit)':'var(--c-loss)')+'">'+fmtMoney(displayProfit)+'</div>'+
    '</div>';
  }).join("");
  document.getElementById("spreadBars").innerHTML=html;
}

// ==================== RENDER AI ANALYSIS ====================
function renderAIAnalysis(){
  const results=profitLines.map(line=>{
    const r=calcProfit(line);
    const displayProfit = activeProfitPeriod === 'today' ? r.profit : (getAvgProfit(line, activeProfitPeriod === '7d' ? 7 : 30) || r.profit);
    return {name:line.name, profit:displayProfit, rawCost:r.rawCost, threshold:line.threshold, productPrice:line.productPrice};
  });
  const sorted=[...results].sort((a,b)=>b.profit-a.profit);
  const best=sorted[0];
  const worst=sorted[sorted.length-1];
  const lossCount=results.filter(r=>r.profit<r.threshold).length;
  const allItems=[...products,...rawMaterials,...intermediates];

  // ========== 1. 市场总览（基于所有产品涨跌） ==========
  const upItems=allItems.filter(i=>i.trend==="up").sort((a,b)=>b.changePct-a.changePct);
  const downItems=allItems.filter(i=>i.trend==="down").sort((a,b)=>a.changePct-b.changePct);
  const topUp=upItems[0];
  const topDown=downItems[0];

  let marketHTML='';
  if(allItems.length>0){
    const upCnt=upItems.length,downCnt=downItems.length,flatCnt=allItems.length-upCnt-downCnt;
    let mood=upCnt>downCnt?'\u5f3a\u52b2\u4e0a\u6da8':downCnt>upCnt?'\u666e\u904d\u56de\u8c03':'\u8d70\u52bf\u5206\u5316';
    marketHTML='<p><strong>\u5f53\u65e5\u5e02\u573a\u603b\u4f53\u2014\u2014</strong>'+mood+'\uff1a\u6da8'+upCnt+'\u8dcc'+downCnt+'\u5e73'+flatCnt+'\u3002';
    if(topUp&&topUp.changePct>0){
      marketHTML+='<span class="profit-text">'+topUp.name+'</span>\u9886\u6da8<span class="profit-text">'+topUp.changePct+'%</span>\uff1b';
    }
    if(topDown&&topDown.changePct<0){
      marketHTML+='<span class="loss-text">'+topDown.name+'</span>\u9886\u8dcc<span class="loss-text">'+Math.abs(topDown.changePct)+'%</span>\u3002';
    }
    // \u5468\u8d8b\u52bf
    const weekUp=allItems.filter(i=>i.weekPct>0).length;
    const weekDown=allItems.filter(i=>i.weekPct<0).length;
    if(weekUp>allItems.length*0.6){
      marketHTML+='\u8fd1\u4e00\u5468\u591a\u6570\u54c1\u79cd\u8d70\u5f3a\uff0c\u4e0a\u884c\u8d8b\u52bf\u660e\u663e\u3002';
    }else if(weekDown>allItems.length*0.6){
      marketHTML+='\u8fd1\u4e00\u5468\u591a\u6570\u54c1\u79cd\u8d70\u5f31\uff0c\u4e0b\u884c\u538b\u529b\u8f83\u5927\u3002';
    }else{
      marketHTML+='\u8fd1\u4e00\u5468\u5e02\u573a\u9707\u8361\uff0c\u5355\u8fb9\u8d8b\u52bf\u672a\u5f62\u6210\u3002';
    }
    marketHTML+='</p>';
  }

  // ========== 2. \u539f\u6599\u9884\u8b66\uff08\u539f\u6599\u4ef7\u683c\u53d8\u5316\u5bf9\u6210\u672c\u7684\u5f71\u54cd\uff09 ==========
  const rawAlerts=[];
  rawMaterials.forEach(r=>{
    if(r.changePct>1){
      rawAlerts.push('<p><span class="warn-text">\u26a0 '+r.name+'\u6210\u672c\u4e0a\u5347</span> \u2014 \u6da8'+r.changePct+'%\u81f3'+r.price.toLocaleString()+r.unit+'\uff0c\u5c06\u76f4\u63a5\u62ac\u9ad8\u4e0b\u6e38\u4ea7\u54c1\u6210\u672c\uff0c\u538b\u7f29\u5229\u6da6\u7a7a\u95f4\u3002\u5efa\u8bae\u63a7\u5236\u5e93\u5b58\uff0c\u7b49\u5f85\u56de\u8c03\u540e\u8865\u5e93\u3002</p>');
    }else if(r.changePct<-1){
      rawAlerts.push('<p><span class="profit-text">\u25b2 '+r.name+'\u6210\u672c\u4e0b\u964d</span> \u2014 \u8dcc'+Math.abs(r.changePct)+'%\u81f3'+r.price.toLocaleString()+r.unit+'\uff0c\u5229\u4e8e\u4e0b\u6e38\u4ea7\u54c1\u5229\u6da6\u4fee\u590d\u3002\u5efa\u8bae\u9002\u5ea6\u8865\u5e93\uff0c\u9501\u5b9a\u6210\u672c\u3002</p>');
    }
  });
  const rawHTML=rawAlerts.length>0?rawAlerts.join(''):'<p>\u5f53\u524d\u539f\u6599\u4ef7\u683c\u8fd0\u884c\u5e73\u7a33\uff0c\u65e0\u660e\u663e\u6210\u672c\u6ce2\u52a8\u3002</p>';

  // ========== 3. \u4ea7\u54c1\u673a\u4f1a/\u98ce\u9669 ==========
  const prodAlerts=[];
  products.forEach(p=>{
    if(p.changePct>2&&p.weekPct>0){
      prodAlerts.push('<p><span class="profit-text">\u25b2 '+p.name+'\u884c\u60c5\u5411\u597d</span> \u2014 \u65e5\u6da8'+p.changePct+'%\u3001\u5468\u6da8'+p.weekPct+'%\uff0c\u4ef7\u683c\u8d70\u5f3a\u3002\u82e5\u6210\u672c\u7aef\u672a\u540c\u6b65\u4e0a\u6da8\uff0c\u5229\u6da6\u6709\u671b\u6269\u5927\u3002</p>');
    }else if(p.changePct<-2&&p.weekPct<0){
      prodAlerts.push('<p><span class="loss-text">\u25bc '+p.name+'\u884c\u60c5\u8d70\u5f31</span> \u2014 \u65e5\u8dcc'+Math.abs(p.changePct)+'%\u3001\u5468\u8dcc'+Math.abs(p.weekPct)+'%\uff0c\u4ef7\u683c\u6301\u7eed\u4e0b\u63a2\u3002\u9700\u5173\u6ce8\u662f\u5426\u63a5\u8fd1\u6216\u7a81\u7834\u6210\u672c\u7ebf\u3002</p>');
    }
  });
  const prodHTML=prodAlerts.length>0?prodAlerts.join(''):'<p>\u4ea7\u54c1\u4ef7\u683c\u6ce2\u52a8\u8f83\u5c0f\uff0c\u6682\u65e0\u660e\u663e\u673a\u4f1a\u6216\u98ce\u9669\u4fe1\u53f7\u3002</p>';

  // ========== 4. \u5229\u6da6\u5206\u6790\uff08\u57fa\u4e8e calcProfit\uff09 ==========
  let profitHTML='';
  const lossItems=results.filter(r=>r.profit<r.threshold).sort((a,b)=>a.profit-b.profit);
  const profitItems=results.filter(r=>r.profit>=r.threshold).sort((a,b)=>b.profit-a.profit);
  if(lossItems.length>0){
    profitHTML+='<h4>\u4e8f\u635f\u4ea7\u54c1\u7ebf</h4>';
    lossItems.forEach((r,i)=>{
      const rawCostPct=Math.round(r.rawCost/r.productPrice*100);
      profitHTML+='<p><strong>'+(i+1)+'. '+r.name+'</strong> \u2014 \u6bdb\u5229<span class="loss-text">'+fmtMoney(r.profit)+'\u5143/\u5428</span>\uff0c\u4f4e\u4e8e\u9884\u8b66\u9608\u503c'+r.threshold+'\u5143\u3002\u539f\u6599\u6210\u672c\u5360\u552e\u4ef7'+rawCostPct+'%\uff0c\u5229\u6da6\u7a7a\u95f4\u88ab\u538b\u7f29\u3002</p>';
    });
  }
  if(profitItems.length>0){
    profitHTML+='<h4>\u76c8\u5229\u4ea7\u54c1\u7ebf</h4>';
    profitItems.slice(0,3).forEach((r,i)=>{
      profitHTML+='<p><strong>'+(i+1)+'. '+r.name+'</strong> \u2014 \u6bdb\u5229<span class="profit-text">'+fmtMoney(r.profit)+'\u5143/\u5428</span>\uff0c\u9ad8\u4e8e\u9884\u8b66\u9608\u503c'+r.threshold+'\u5143\u3002</p>';
    });
  }

  // ========== 5. \u91c7\u8d2d\u5efa\u8bae ==========
  let buyHTML='';
  const buyCandidates=rawMaterials.filter(r=>r.changePct<-0.5).sort((a,b)=>a.changePct-b.changePct);
  const sellCandidates=rawMaterials.filter(r=>r.changePct>1).sort((a,b)=>b.changePct-a.changePct);
  if(buyCandidates.length>0){
    buyHTML+='<p><strong>\u9002\u5ea6\u8865\u5e93\uff1a</strong>'+buyCandidates.map(r=>r.name+'(\u8dcc'+Math.abs(r.changePct)+'%)').join('\u3001')+'\u2014\u2014\u4ef7\u683c\u56de\u8c03\uff0c\u53ef\u9002\u5ea6\u8865\u5e93\u9501\u5b9a\u6210\u672c\u3002</p>';
  }
  if(sellCandidates.length>0){
    buyHTML+='<p><strong>\u63a7\u5236\u5e93\u5b58\uff1a</strong>'+sellCandidates.map(r=>r.name+'(\u6da8'+r.changePct+'%)').join('\u3001')+'\u2014\u2014\u4ef7\u683c\u4e0a\u884c\uff0c\u5efa\u8bae\u7b49\u5f85\u56de\u8c03\u540e\u518d\u8865\u3002</p>';
  }
  if(!buyHTML){
    buyHTML='<p>\u5f53\u524d\u539f\u6599\u4ef7\u683c\u8fd0\u884c\u5e73\u7a33\uff0c\u6682\u65e0\u660e\u786e\u91c7\u8d2d\u4fe1\u53f7\u3002</p>';
  }

  // ========== 6. \u6392\u4ea7\u5efa\u8bae ==========
  let adviceHTML='';
  adviceHTML+='<p><strong>\u4f18\u5148\u4fdd\u969c\uff1a</strong>'+best.name+'\uff08\u6bdb\u5229'+fmtMoney(best.profit)+'\u5143/\u5428\uff09\u2014\u2014\u8d21\u732e\u6700\u5927\u5229\u6da6\uff0c\u6ee1\u8d1f\u8377\u8fd0\u884c\u3002</p>';
  if(worst.profit<worst.threshold){
    adviceHTML+='<p><strong>\u98ce\u9669\u63a7\u5236\uff1a</strong>'+worst.name+'\uff08\u6bdb\u5229'+fmtMoney(worst.profit)+'\u5143/\u5428\uff09\u5df2\u4f4e\u4e8e\u9884\u8b66\u9608\u503c\uff0c\u5efa\u8bae\u9002\u5ea6\u964d\u4f4e\u8d1f\u8377\u6216\u68c0\u4fee\u8c03\u6574\u3002</p>';
  }

  document.getElementById("aiContent").innerHTML=
    '<div class="ai-section market"><h4><span class="dot"></span> \u5e02\u573a\u603b\u89c8</h4>'+marketHTML+'</div>'+
    '<div class="ai-section raw"><h4><span class="dot"></span> \u539f\u6599\u6210\u672c\u9884\u8b66</h4>'+rawHTML+'</div>'+
    '<div class="ai-section prod"><h4><span class="dot"></span> \u4ea7\u54c1\u884c\u60c5\u9884\u8b66</h4>'+prodHTML+'</div>'+
    '<div class="ai-section profit"><h4><span class="dot"></span> \u5229\u6da6\u5206\u6790</h4>'+profitHTML+'</div>'+
    '<div class="ai-section buy"><h4><span class="dot"></span> \u91c7\u8d2d\u5efa\u8bae</h4>'+buyHTML+'</div>'+
    '<div class="ai-section advice"><h4><span class="dot"></span> \u6392\u4ea7\u5efa\u8bae</h4>'+adviceHTML+
      '<div class="ai-metrics">'+
        '<div class="ai-metric"><div class="am-num profit-text" style="color:var(--c-profit)">'+fmtMoney(best.profit)+'</div><div class="am-label">\u6700\u9ad8\u6bdb\u5229('+best.name+')</div></div>'+
        '<div class="ai-metric"><div class="am-num loss-text" style="color:'+(worst.profit>=0?'var(--c-warn)':'var(--c-loss)')+'">'+fmtMoney(worst.profit)+'</div><div class="am-label">\u6700\u4f4e\u6bdb\u5229('+worst.name+')</div></div>'+
        '<div class="ai-metric"><div class="am-num" style="color:var(--c-warn)">'+lossCount+'/'+results.length+'</div><div class="am-label">\u4f4e\u4e8e\u9884\u8b66\u9608\u503c</div></div>'+
      '</div>'+
    '</div>';
}

// ==================== TREND MODAL ====================
function showTrendModal(item){
  const history=getHistory(item);
  const isReal = priceHistory.length >= 7;
  const prices=history.map(d=>d.price);
  const minP=Math.min(...prices);
  const maxP=Math.max(...prices);
  const avgP=Math.round(prices.reduce((a,b)=>a+b,0)/prices.length);
  const arrow=item.trend==="up"?"\u25B2":item.trend==="down"?"\u25BC":"\u2014";
  const changeColor=item.trend==="up"?"var(--c-up)":item.trend==="down"?"var(--c-down)":"var(--c-flat)";

  let alertHTML="";
  if(item.alert){
    const a=item.alert;
    let icon="\u26a0";
    if(a.type==="surge")icon="\u25B2";
    else if(a.type==="crash")icon="\u25BC";
    let tagsHTML="";
    if(a.tags&&a.tags.length>0){
      tagsHTML='<div class="modal-alert-tags">'+a.tags.map(t=>'<span class="modal-alert-tag">'+t+'</span>').join("")+'</div>';
    }
    alertHTML='<div class="modal-alert '+a.type+'">'+
      '<div class="modal-alert-head"><span class="modal-alert-icon">'+icon+'</span><span class="modal-alert-title">'+a.title+'</span></div>'+
      '<div class="modal-alert-body">'+a.body+'</div>'+
      tagsHTML+
    '</div>';
  }

  document.getElementById("modalContent").innerHTML=
    '<div class="modal-head">'+
      '<div><div class="modal-title">'+item.name+'</div><div class="modal-formula">'+item.formula+'</div></div>'+
      '<div style="text-align:right"><div class="modal-price">'+item.price.toLocaleString()+'<span>'+item.unit+'</span></div>'+
      '<div class="modal-change" style="color:'+changeColor+'">'+arrow+' '+(item.change>0?"+":"")+item.change+' ('+(item.changePct>0?"+":"")+item.changePct+'%)</div></div>'+
    '</div>'+
    alertHTML+
    '<div class="modal-chart-wrap"><canvas class="modal-chart" id="trendCanvas"></canvas></div>'+
    '<div class="modal-chart-label" style="text-align:center;font-size:11px;color:var(--c-text-dim);margin-top:4px">'+(isReal?'\u25cf \u771f\u5b9e\u5386\u53f2\u6570\u636e':'\u25cb \u6a21\u62df\u8d8b\u52bf\uff08\u5f85\u5386\u53f2\u6570\u636e\u79ef\u7d2f\uff09')+'</div>'+
    '<div class="modal-stats">'+
      '<div class="modal-stat"><div class="ms-val" style="color:var(--c-up)">'+maxP.toLocaleString()+'</div><div class="ms-lbl">'+history.length+'\u65e5\u6700\u9ad8</div></div>'+
      '<div class="modal-stat"><div class="ms-val" style="color:var(--c-down)">'+minP.toLocaleString()+'</div><div class="ms-lbl">'+history.length+'\u65e5\u6700\u4f4e</div></div>'+
      '<div class="modal-stat"><div class="ms-val" style="color:var(--c-accent)">'+avgP.toLocaleString()+'</div><div class="ms-lbl">'+history.length+'\u65e5\u5747\u503c</div></div>'+
      '<div class="modal-stat"><div class="ms-val" style="color:'+changeColor+'">'+(item.weekPct>0?"+":"")+item.weekPct+'%</div><div class="ms-lbl">\u5468\u6da8\u8dcc</div></div>'+
    '</div>';
  document.getElementById("modalOverlay").classList.add("active");
  // Draw chart after DOM ready
  setTimeout(()=>drawTrendChart(document.getElementById("trendCanvas"),history,item.trend),50);
}

function drawTrendChart(canvas,data,trend){
  if(!canvas) return;
  const ctx=canvas.getContext("2d");
  const dpr=window.devicePixelRatio||1;
  const w=canvas.clientWidth;
  const h=canvas.clientHeight;
  canvas.width=w*dpr;
  canvas.height=h*dpr;
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);

  const pad={top:20,right:20,bottom:28,left:52};
  const cw=w-pad.left-pad.right;
  const ch=h-pad.top-pad.bottom;
  const prices=data.map(d=>d.price);
  const minP=Math.min(...prices);
  const maxP=Math.max(...prices);
  const range=Math.max(maxP-minP,1);
  const yMin=minP-range*0.15;
  const yMax=maxP+range*0.15;

  // Grid
  ctx.strokeStyle="#2D3D50";
  ctx.lineWidth=1;
  ctx.fillStyle="#5A6577";
  ctx.font="10px monospace";
  ctx.textAlign="right";
  for(let i=0;i<=4;i++){
    const y=pad.top+(ch/4)*i;
    ctx.beginPath();
    ctx.moveTo(pad.left,y);
    ctx.lineTo(pad.left+cw,y);
    ctx.stroke();
    const val=yMax-((yMax-yMin)/4)*i;
    ctx.fillText(Math.round(val).toLocaleString(),pad.left-6,y+3);
  }

  // Area fill
  const lineColor=trend==="up"?"#E03935":trend==="down"?"#16A34A":"#8895A5";
  ctx.beginPath();
  data.forEach((d,i)=>{
    const x=pad.left+(cw/(data.length-1))*i;
    const y=pad.top+ch-((d.price-yMin)/(yMax-yMin))*ch;
    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  });
  ctx.lineTo(pad.left+cw,pad.top+ch);
  ctx.lineTo(pad.left,pad.top+ch);
  ctx.closePath();
  const grad=ctx.createLinearGradient(0,pad.top,0,pad.top+ch);
  const fillColor=trend==="up"?"rgba(224,57,53,0.12)":trend==="down"?"rgba(22,163,74,0.12)":"rgba(136,149,165,0.12)";
  grad.addColorStop(0,fillColor);
  grad.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=grad;
  ctx.fill();

  // Line
  ctx.strokeStyle=lineColor;
  ctx.lineWidth=2;
  ctx.lineJoin="round";
  ctx.beginPath();
  data.forEach((d,i)=>{
    const x=pad.left+(cw/(data.length-1))*i;
    const y=pad.top+ch-((d.price-yMin)/(yMax-yMin))*ch;
    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  });
  ctx.stroke();

  // Last point
  const lastX=pad.left+cw;
  const lastY=pad.top+ch-((data[data.length-1].price-yMin)/(yMax-yMin))*ch;
  ctx.fillStyle=lineColor;
  ctx.beginPath();
  ctx.arc(lastX,lastY,5,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle="#fff";
  ctx.lineWidth=2;
  ctx.stroke();

  // X labels
  ctx.fillStyle="#5A6577";
  ctx.font="10px sans-serif";
  ctx.textAlign="center";
  for(let i=0;i<data.length;i+=7){
    const x=pad.left+(cw/(data.length-1))*i;
    ctx.fillText(data[i].date,x,h-8);
  }
}

// ==================== COST INPUT HANDLING ====================
function initCostInputs(){
  const h2Input=document.getElementById("costH2");
  const steamInput=document.getElementById("costSteam");
  const powerInput=document.getElementById("costPower");
  h2Input.value=costParams.h2;
  steamInput.value=costParams.steam;
  powerInput.value=costParams.power;

  function onCostChange(){
    costParams.h2=parseFloat(h2Input.value)||0;
    costParams.steam=parseFloat(steamInput.value)||0;
    costParams.power=parseFloat(powerInput.value)||0;
    localStorage.setItem('th_cost_h2',costParams.h2);
    localStorage.setItem('th_cost_steam',costParams.steam);
    localStorage.setItem('th_cost_power',costParams.power);
    renderProfitCards();
    renderSpreadBars();
    renderAIAnalysis();
  }
  h2Input.addEventListener("input",onCostChange);
  steamInput.addEventListener("input",onCostChange);
  powerInput.addEventListener("input",onCostChange);

  document.getElementById("costReset").addEventListener("click",()=>{
    costParams={...defaultCosts};
    h2Input.value=defaultCosts.h2;
    steamInput.value=defaultCosts.steam;
    powerInput.value=defaultCosts.power;
    localStorage.removeItem('th_cost_h2');
    localStorage.removeItem('th_cost_steam');
    localStorage.removeItem('th_cost_power');
    renderProfitCards();
    renderSpreadBars();
    renderAIAnalysis();
  });
}

// ==================== CARD CLICK -> MODAL ====================
function initCardClick(){
  const allItems=[...products,...rawMaterials,...intermediates];
  document.querySelectorAll(".price-card").forEach(card=>{
    card.addEventListener("click",()=>{
      const key=card.dataset.key;
      const item=allItems.find(i=>i.name===key);
      if(item) showTrendModal(item);
    });
  });
}

// ==================== PERIOD SWITCHER ====================
function initPeriodSwitcher(){
  const hint = document.getElementById("periodHint");
  function updateHint(){
    if(activeProfitPeriod === 'today'){
      hint.textContent = '';
    }else{
      const days = activeProfitPeriod === '7d' ? 7 : 30;
      const available = Math.min(priceHistory.length, days);
      if(available < 2){
        hint.textContent = '\u26a0 \u5386\u53f2\u6570\u636e\u4e0d\u8db3\uff0c\u4ec5\u6709'+priceHistory.length+'\u5929\uff0c\u6682\u7528\u5f53\u65e5\u6570\u636e\u66ff\u4ee3';
      }else{
        hint.textContent = '\u57fa\u4e8e'+available+'\u5929\u5386\u53f2\u5747\u503c\u8ba1\u7b97';
      }
    }
  }
  document.querySelectorAll(".ps-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      document.querySelectorAll(".ps-btn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      activeProfitPeriod = btn.dataset.period;
      updateHint();
      renderProfitCards();
      renderSpreadBars();
      renderAIAnalysis();
    });
  });
  updateHint();
}

// ==================== PROFIT CARD CLICK -> AI ANALYSIS MODAL ====================
function showAnalysisModal(line){
  const r=calcProfit(line);
  const a=line.analysis;
  if(!a) return;
  const status=r.profit>=line.threshold?"profit":"loss";
  const statusText=status==="profit"?"\u76c8\u5229":"\u4e8f\u635f";
  const statusColor=status==="profit"?"var(--c-profit)":"var(--c-loss)";
  const rawPct=Math.round(r.rawCost/r.profit>0?r.rawCost/line.productPrice*100:0);
  const utilPct=Math.round(r.utilityTotal/line.productPrice*100);

  let reasonsHTML="";
  a.reasons.forEach(reason=>{
    reasonsHTML+='<li>'+reason+'</li>';
  });

  let tagsHTML="";
  a.tags.forEach(tag=>{
    tagsHTML+='<span class="analysis-tag">'+tag+'</span>';
  });

  document.getElementById("modalContent").innerHTML=
    '<div class="analysis-headline">'+a.headline+'</div>'+
    '<div class="analysis-sub">'+line.name+' \u00b7 '+line.plant.capacity+' \u00b7 '+line.plant.unitName+'</div>'+
    '<div class="analysis-section-title"><span class="ast-dot"></span>\u6838\u5fc3\u539f\u56e0\u5206\u6790</div>'+
    '<ul class="analysis-reason-list">'+reasonsHTML+'</ul>'+
    '<div class="analysis-section-title"><span class="ast-dot" style="background:var(--c-warn)"></span>\u540e\u7eed\u5c55\u671b</div>'+
    '<div class="analysis-outlook">'+a.outlook+'</div>'+
    '<div class="analysis-tags">'+tagsHTML+'</div>'+
    '<div class="analysis-metrics">'+
      '<div class="analysis-metric"><div class="am-val" style="color:'+statusColor+'">'+fmtMoney(r.profit)+'</div><div class="am-lbl">\u5428\u6bdb\u5229(\u5143/\u5428)</div></div>'+
      '<div class="analysis-metric"><div class="am-val" style="color:var(--c-warn)">'+rawPct+'%</div><div class="am-lbl">\u539f\u6599\u5360\u552e\u4ef7\u6bd4</div></div>'+
      '<div class="analysis-metric"><div class="am-val" style="color:var(--c-accent)">'+utilPct+'%</div><div class="am-lbl">\u516c\u7528\u5de5\u7a0b\u5360\u552e\u4ef7\u6bd4</div></div>'+
    '</div>';

  document.getElementById("modalOverlay").classList.add("active");
}

function initProfitCardClick(){
  document.querySelectorAll(".profit-card").forEach(card=>{
    card.addEventListener("click",e=>{
      // \u4e0d\u54cd\u5e94\u8f93\u5165\u6846\u70b9\u51fb
      if(e.target.tagName==="INPUT") return;
      const name=card.querySelector(".profit-name");
      if(!name) return;
      const line=profitLines.find(l=>l.name===name.textContent);
      if(line&&line.analysis) showAnalysisModal(line);
    });
  });
}

// ==================== TAB SWITCH ====================
function initTabs(){
  document.querySelector(".tab-bar").addEventListener("click",e=>{
    if(e.target.classList.contains("tab-btn")){
      document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));

// ==================== MODAL CLOSE ====================
function initModalClose(){
  document.getElementById("modalClose").addEventListener("click",()=>{
    document.getElementById("modalOverlay").classList.remove("active");
  });
  document.getElementById("modalOverlay").addEventListener("click",e=>{
    if(e.target===document.getElementById("modalOverlay")){
      document.getElementById("modalOverlay").classList.remove("active");

// ==================== DATE ====================
function setDate(){
  if(priceData && priceData.lastUpdate){
    document.getElementById("topDate").textContent="数据更新时间："+priceData.lastUpdate;
  }else{
    const now=new Date();
    const pad=n=>n<10?'0'+n:n;
    document.getElementById("topDate").textContent=
      now.getFullYear()+"年"+(now.getMonth()+1)+"月"+now.getDate()+"日 "+
      pad(now.getHours())+":"+pad(now.getMinutes());
  }
}

// ==================== UPDATE BUTTON ====================
function initUpdatePrice(){
  const btn = document.getElementById("updatePriceBtn");
  const originalText = "更新";

  btn.addEventListener("click", async ()=>{
    btn.textContent = "请稍后";
    btn.disabled = true;
    btn.style.opacity = "0.6";
    btn.style.cursor = "not-allowed";

    const ok = await loadData(true); // cache-bust
    if(ok){
      renderAllPriceCards();
      renderPeerPlants();
      renderNewsBoard();
      renderProfitCards();
      renderSpreadBars();
      renderAIAnalysis();
      initCardClick();
      setDate();
      btn.textContent = "更新成功";
      setTimeout(()=>{
        btn.textContent = originalText;
        btn.disabled = false;
        btn.style.opacity = "";
        btn.style.cursor = "";
      }, 1500);
    }else{
      btn.textContent = "更新失败";
      setTimeout(()=>{
        btn.textContent = originalText;
        btn.disabled = false;
        btn.style.opacity = "";
        btn.style.cursor = "";
      }, 1500);
    }
  });
}

// ==================== SERVICE WORKER (PWA) ====================
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      console.log('[PWA] Service Worker registered');
    }).catch(err=>{
      console.warn('[PWA] SW registration failed:', err);
    });

    // Offline indicator
    function updateOnlineStatus(){
      const badge=document.getElementById('pwaBadge');
      if(!badge) return;
      if(!navigator.onLine){
        badge.style.display='inline-block';
        badge.className='pwa-badge offline';
        badge.textContent='\u26a0 \u79bb\u7ebf\u6a21\u5f0f';
      }else{
        // Check if running as installed PWA
        if(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone){
          badge.style.display='inline-block';
          badge.className='pwa-badge installed';
          badge.textContent='\u25cf \u5df2\u5b89\u88c5';
        }else{
          badge.style.display='none';
        }
      }
    }
    window.addEventListener('online',updateOnlineStatus);
    window.addEventListener('offline',updateOnlineStatus);
    updateOnlineStatus();
  });
}

  const ok = await loadData();
  if(ok){
    setDate();
    renderAllPriceCards();
    renderPeerPlants();

}
init();
